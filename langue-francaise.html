<script>
var CATS=[["all","Tout"],["gram","Grammaire"],["conj","Conjugaison"],["orth","Orthographe"],["voc","Vocabulaire"],["style","Style et sens"]];
var TITLES={gram:"Grammaire",conj:"Conjugaison",orth:"Orthographe",voc:"Vocabulaire",style:"Style et sens"};
var L=[
{c:"gram",t:"Les classes grammaticales",n:"1AC",h:`<p>Il y a dix classes de mots. <b>Variables</b> : nom, déterminant, adjectif, pronom, verbe. <b>Invariables</b> : adverbe, préposition, conjonction de coordination, conjonction de subordination, interjection.</p><div class="ex"><i>Les petits chats dorment paisiblement sur le canapé.</i><br>Les (déterminant) · petits (adjectif) · chats (nom) · dorment (verbe) · paisiblement (adverbe) · sur (préposition) · le (déterminant) · canapé (nom).</div>`},
{c:"gram",t:"Les fonctions dans la phrase",n:"1AC–2AC",h:`<p><b>Sujet</b> : celui qui fait l’action (question : qui est-ce qui… ?). <b>COD</b> : répond à « quoi ? / qui ? » sans préposition. <b>COI</b> : introduit par à ou de. <b>Attribut du sujet</b> : après un verbe d’état (être, sembler, paraître, devenir). <b>Complément circonstanciel</b> : lieu, temps, manière, cause… (déplaçable, supprimable).</p><div class="ex"><i>Hier, Sara a offert un livre à son frère.</i><br>Hier (CC de temps) · Sara (sujet) · un livre (COD) · à son frère (COI).</div>`},
{c:"gram",t:"Types et formes de phrases",n:"1AC",h:`<p><b>Quatre types</b> : déclaratif (.), interrogatif (?), impératif (! / .), exclamatif (!). <b>Formes</b> : affirmative ou négative (ne… pas, ne… jamais, ne… plus, ne… rien) ; active ou passive ; emphatique.</p><div class="ex"><i>Le chat mange la souris.</i> (active) → <i>La souris est mangée par le chat.</i> (passive)</div>`},
{c:"gram",t:"Phrase simple, phrase complexe, propositions",n:"2AC",h:`<p>Une phrase simple contient un seul verbe conjugué. Une phrase complexe en contient plusieurs. Les propositions sont reliées par : <b>juxtaposition</b> (virgule), <b>coordination</b> (mais, ou, et, donc, or, ni, car) ou <b>subordination</b> (que, quand, parce que, si…).</p><div class="ex"><i>Je pense [que tu as raison].</i> → principale + subordonnée complétive.</div>`},
{c:"gram",t:"Les subordonnées circonstancielles",n:"2AC–3AC",h:`<div class="tw"><table><tr><th>Valeur</th><th>Conjonctions</th><th>Exemple</th></tr>
<tr><td>Cause</td><td>parce que, puisque, comme, car</td><td><i>Il est absent parce qu’il est malade.</i></td></tr>
<tr><td>Conséquence</td><td>si bien que, de sorte que, tellement… que</td><td><i>Il pleut tellement que la route est inondée.</i></td></tr>
<tr><td>But</td><td>pour que, afin que (+ subjonctif)</td><td><i>Je parle fort pour qu’on m’entende.</i></td></tr>
<tr><td>Comparaison</td><td>comme, ainsi que, plus… que</td><td><i>Il court comme un lièvre.</i></td></tr>
<tr><td>Temps</td><td>quand, lorsque, dès que, avant que</td><td><i>Dès que tu arrives, nous partons.</i></td></tr>
<tr><td>Condition</td><td>si, à condition que, au cas où</td><td><i>Si tu travailles, tu réussiras.</i></td></tr>
<tr><td>Concession</td><td>bien que, quoique (+ subjonctif)</td><td><i>Bien qu’il soit fatigué, il travaille.</i></td></tr></table></div>`},
{c:"gram",t:"Les pronoms",n:"2AC",h:`<p><b>Personnels</b> : je, tu, il, me, te, le, lui, leur, y, en. <b>Relatifs</b> : qui (sujet), que (COD), dont (de), où (lieu/temps). <b>Démonstratifs</b> : celui, celle, ceci, cela. <b>Possessifs</b> : le mien, la tienne…</p><div class="ex"><i>Le livre que j’ai lu, dont tu m’as parlé, est celui que je préfère.</i></div>`},
{c:"gram",t:"Le discours direct et indirect",n:"3AC",h:`<p>Au passage au discours indirect : on supprime les guillemets et les deux-points, on ajoute <i>que</i>, <i>si</i> ou <i>de</i>, on change les pronoms, et on adapte les temps si le verbe introducteur est au passé.</p><div class="ex">Il dit : « Je viens demain. » → <i>Il dit qu’il vient demain.</i><br>Il a dit : « Je viens demain. » → <i>Il a dit qu’il viendrait le lendemain.</i></div>`},
{c:"conj",t:"Les groupes de verbes et le présent",n:"1AC",h:`<p><b>1er groupe</b> : -er (chanter). <b>2e groupe</b> : -ir / -issant (finir). <b>3e groupe</b> : tous les autres (aller, prendre, venir, faire…).</p><div class="tw"><table><tr><th></th><th>chanter</th><th>finir</th><th>prendre</th></tr><tr><td>je</td><td>chante</td><td>finis</td><td>prends</td></tr><tr><td>tu</td><td>chantes</td><td>finis</td><td>prends</td></tr><tr><td>il</td><td>chante</td><td>finit</td><td>prend</td></tr><tr><td>nous</td><td>chantons</td><td>finissons</td><td>prenons</td></tr><tr><td>vous</td><td>chantez</td><td>finissez</td><td>prenez</td></tr><tr><td>ils</td><td>chantent</td><td>finissent</td><td>prennent</td></tr></table></div>`},
{c:"conj",t:"Imparfait, passé composé et passé simple",n:"1AC–2AC",h:`<p><b>Imparfait</b> : description, habitude, action en cours (-ais, -ais, -ait, -ions, -iez, -aient). <b>Passé composé</b> : action terminée (avoir/être + participe passé). <b>Passé simple</b> : action terminée dans un récit (il chanta, ils finirent).</p><div class="ex"><i>Il pleuvait (imparfait) quand je suis sorti (passé composé).</i><br><i>Il pleuvait quand il sortit.</i> (récit)</div>`},
{c:"conj",t:"Futur simple et conditionnel présent",n:"2AC",h:`<p><b>Futur</b> : infinitif + -ai, -as, -a, -ons, -ez, -ont (<i>je chanterai</i>). <b>Conditionnel</b> : infinitif + -ais, -ais, -ait, -ions, -iez, -aient (<i>je chanterais</i>). Radicaux irréguliers : ser- (être), aur- (avoir), ir- (aller), fer- (faire), verr- (voir), pourr- (pouvoir).</p><div class="ex"><i>Demain, j’irai au musée.</i> · <i>Si j’avais le temps, j’irais au musée.</i></div>`},
{c:"conj",t:"Le subjonctif présent",n:"3AC",h:`<p>Il s’emploie après les verbes de volonté, de souhait, de doute, de sentiment, et après certaines conjonctions (pour que, afin que, bien que, avant que).</p><div class="ex"><i>Il faut que tu viennes.</i> · <i>Je veux que nous finissions.</i><br>Irréguliers : que je sois, que j’aie, que j’aille, que je fasse, que je puisse.</div>`},
{c:"conj",t:"L’impératif",n:"1AC",h:`<p>Trois personnes seulement : tu, nous, vous. Pas de pronom sujet. Au 1er groupe, pas de -s à la 2e personne du singulier : <i>chante !</i> (sauf devant y et en : <i>manges-en</i>).</p><div class="ex"><i>Finis ton travail !</i> · <i>Prenons le bus.</i> · <i>Soyez à l’heure.</i></div>`},
{c:"orth",t:"L’accord du participe passé",n:"2AC–3AC",h:`<p><b>Avec être</b> : accord avec le sujet. <b>Avec avoir</b> : accord avec le COD seulement s’il est placé avant le verbe. <b>Verbes pronominaux</b> : accord avec le sujet (sauf si le pronom est COI).</p><div class="ex"><i>Elles sont parties.</i> · <i>Les fleurs que j’ai cueillies.</i> · <i>Elle a cueilli des fleurs.</i> · <i>Elles se sont téléphoné.</i> (COI : pas d’accord)</div>`},
{c:"orth",t:"Les homophones grammaticaux",n:"1AC–2AC",h:`<div class="tw"><table><tr><th>Homophones</th><th>Astuce</th></tr>
<tr><td>a / à</td><td>a = avait (<i>il a faim</i>) ; à = préposition (<i>à Rabat</i>)</td></tr>
<tr><td>et / est</td><td>est = était (<i>elle est belle</i>) ; et = et puis</td></tr>
<tr><td>on / ont</td><td>ont = avaient (<i>ils ont soif</i>) ; on = il</td></tr>
<tr><td>son / sont</td><td>sont = étaient ; son = mon, ton</td></tr>
<tr><td>ou / où</td><td>où = lieu ou temps ; ou = ou bien</td></tr>
<tr><td>ces / ses</td><td>ces = ceux-ci (désigne) ; ses = les siens (possession)</td></tr>
<tr><td>c’est / s’est</td><td>s’est = verbe pronominal (<i>il s’est lavé</i>) ; c’est = cela est</td></tr>
<tr><td>leur / leurs</td><td>pronom : leur est invariable ; déterminant : leur(s) s’accorde</td></tr>
<tr><td>quel(le) / qu’elle</td><td>qu’elle = que + elle</td></tr></table></div>`},
{c:"orth",t:"Le pluriel et le féminin",n:"1AC",h:`<p><b>Pluriel</b> : on ajoute -s ; -s, -x, -z ne changent pas ; -eau, -eu, -au → -x ; -al → -aux (<i>cheval → chevaux</i>) ; sept noms en -ou prennent -x (bijou, caillou, chou, genou, hibou, joujou, pou).</p><p><b>Féminin</b> : on ajoute -e (<i>petit → petite</i>) ; -er → -ère ; -eur → -euse ; -teur → -trice ; consonne doublée (<i>bon → bonne</i>).</p>`},
{c:"orth",t:"Les accents, la cédille et les majuscules",n:"1AC",h:`<p>Accent aigu (é), grave (è, à, ù), circonflexe (ê, â, î, ô, û), tréma (ë, ï). La <b>cédille</b> (ç) se met devant a, o, u pour le son [s] : <i>français, leçon, reçu</i>. La <b>majuscule</b> s’emploie en début de phrase, pour les noms propres et les noms de peuples (<i>les Marocains</i>), mais pas pour les langues ni les adjectifs (<i>le français, marocain</i>).</p>`},
{c:"voc",t:"Préfixes, suffixes et familles de mots",n:"1AC–2AC",h:`<p>Un mot se forme avec un <b>radical</b>, un <b>préfixe</b> (devant) et un <b>suffixe</b> (derrière).</p><div class="ex">Préfixes : in-/im-/il-/ir- (contraire : <i>impossible</i>), re- (répétition : <i>refaire</i>), dé- (<i>défaire</i>), pré- (avant : <i>préhistoire</i>).<br>Suffixes : -able (<i>lisible</i>), -tion (<i>création</i>), -ment (<i>lentement</i>), -eur (<i>chanteur</i>).<br>Famille de <i>terre</i> : terrain, terrasse, enterrer, atterrir, territoire.</div>`},
{c:"voc",t:"Synonymes, antonymes, homonymes",n:"1AC",h:`<p><b>Synonymes</b> : sens proches (<i>beau / joli</i>). <b>Antonymes</b> : sens contraires (<i>grand / petit</i>). <b>Homonymes</b> : même prononciation, sens différents (<i>vert, verre, vers, ver</i>). <b>Paronymes</b> : proches mais différents (<i>éminent / imminent</i>).</p>`},
{c:"voc",t:"Champ lexical et champ sémantique",n:"2AC",h:`<p>Le <b>champ lexical</b> regroupe les mots d’un même thème dans un texte (<i>mer : vague, navire, plage, marin</i>). Le <b>champ sémantique</b> regroupe les sens possibles d’un même mot (<i>« avocat » : fruit, juriste</i>). Le sens <b>propre</b> est le sens premier ; le sens <b>figuré</b> est imagé (<i>avoir un cœur d’or</i>).</p>`},
{c:"voc",t:"Les figures de style",n:"2AC–3AC",h:`<div class="tw"><table><tr><th>Figure</th><th>Définition</th><th>Exemple</th></tr>
<tr><td>Comparaison</td><td>rapproche deux éléments avec un outil (comme, tel…)</td><td><i>Il est rapide comme l’éclair.</i></td></tr>
<tr><td>Métaphore</td><td>comparaison sans outil</td><td><i>Cet homme est un lion.</i></td></tr>
<tr><td>Personnification</td><td>donne des traits humains à une chose</td><td><i>Le vent murmure.</i></td></tr>
<tr><td>Hyperbole</td><td>exagération</td><td><i>Je meurs de faim.</i></td></tr>
<tr><td>Antithèse</td><td>oppose deux idées</td><td><i>Le jour et la nuit.</i></td></tr>
<tr><td>Anaphore</td><td>répétition en début de phrase</td><td><i>Paris brisé, Paris outragé…</i></td></tr><tr><td>Gradation</td><td>idées en ordre croissant ou décroissant</td><td><i>Va, cours, vole !</i></td></tr><tr><td>Litote</td><td>dire peu pour suggérer beaucoup</td><td><i>Ce n’est pas mauvais.</i></td></tr><tr><td>Euphémisme</td><td>adoucit une réalité dure</td><td><i>Il nous a quittés.</i></td></tr><tr><td>Oxymore</td><td>associe deux mots contradictoires</td><td><i>Un silence assourdissant.</i></td></tr><tr><td>Antiphrase</td><td>dit le contraire de ce qu’on pense</td><td><i>Quel beau temps ! (sous la pluie)</i></td></tr><tr><td>Métonymie</td><td>remplace un mot par un autre lié à lui</td><td><i>Boire un verre.</i></td></tr><tr><td>Périphrase</td><td>remplace un mot par une expression</td><td><i>La ville blanche (Casablanca).</i></td></tr><tr><td>Accumulation</td><td>énumération de termes</td><td><i>Cris, pleurs, rires, chansons.</i></td></tr><tr><td>Chiasme</td><td>structure croisée A-B / B-A</td><td><i>Il faut manger pour vivre, non vivre pour manger.</i></td></tr><tr><td>Question rhétorique</td><td>question sans attente de réponse</td><td><i>Qui ne veut pas être heureux ?</i></td></tr></table></div>`},
{c:"gram",t:"Subordonnée de temps",n:"2AC–3AC",h:`<p>Conjonctions : quand, lorsque, comme, dès que, aussitôt que, pendant que, tandis que, depuis que, avant que, après que, jusqu’à ce que, en attendant que.</p><div class=\"ex\"><b>Simultanéité</b> : <i>Quand il pleut, je reste chez moi.</i><br><b>Antériorité</b> : <i>Avant qu’il parte, appelle-le.</i> (subjonctif)<br><b>Postériorité</b> : <i>Après qu’il est parti, nous avons mangé.</i> (indicatif)</div><p>Avec <i>avant que</i>, <i>jusqu’à ce que</i> et <i>en attendant que</i>, on emploie le subjonctif ; avec les autres, l’indicatif.</p>`},
{c:"gram",t:"Subordonnées de cause et de conséquence",n:"2AC–3AC",h:`<p><b>Cause</b> (pourquoi ?) : parce que, puisque (cause connue), comme (en tête de phrase), car, étant donné que, du fait que, sous prétexte que. Indicatif.</p><div class=\"ex\"><i>Comme il pleuvait, nous sommes restés.</i> · <i>Puisque tu le sais, dis-le.</i></div><p><b>Conséquence</b> (quel résultat ?) : si bien que, de sorte que, tellement / si / tant… que, au point que, assez… pour que. Indicatif (fait réel) ; subjonctif après une négation ou une question.</p><div class=\"ex\"><i>Il a tant couru qu’il est épuisé.</i> · <i>Il n’est pas si fatigué qu’il ne puisse venir.</i></div>`},
{c:"gram",t:"Subordonnées de but et de condition",n:"2AC–3AC",h:`<p><b>But</b> (dans quel objectif ?) : pour que, afin que, de peur que, de crainte que, de façon que. <b>Toujours le subjonctif.</b></p><div class=\"ex\"><i>Il répète afin que tout le monde comprenne.</i></div><p><b>Condition</b> : si, à condition que, pourvu que, au cas où, à moins que, soit que.</p><div class=\"tw\"><table><tr><th>Si…</th><th>Principale</th><th>Valeur</th></tr><tr><td>présent</td><td>futur / présent / impératif</td><td>réel</td></tr><tr><td>imparfait</td><td>conditionnel présent</td><td>irréel du présent</td></tr><tr><td>plus-que-parfait</td><td>conditionnel passé</td><td>irréel du passé</td></tr></table></div><div class=\"ex\"><i>Si tu étudies, tu réussiras.</i> · <i>Si j’avais su, je serais venu.</i></div>`},
{c:"gram",t:"Comparaison, concession et opposition",n:"2AC–3AC",h:`<p><b>Comparaison</b> : comme, ainsi que, de même que, plus / moins / aussi… que, autant que, comme si (+ imparfait ou plus-que-parfait).</p><div class=\"ex\"><i>Il parle comme s’il savait tout.</i></div><p><b>Concession</b> (obstacle sans effet) : bien que, quoique, encore que (+ subjonctif) ; même si, quand bien même (+ indicatif ou conditionnel).</p><div class=\"ex\"><i>Bien qu’il soit malade, il vient.</i></div><p><b>Opposition</b> : alors que, tandis que, au lieu que, sans que.</p><div class=\"ex\"><i>Il rit alors que sa sœur pleure.</i></div>`},
{c:"gram",t:"Les subordonnées relatives",n:"2AC–3AC",h:`<p>Elles complètent un nom ou un pronom, l’<b>antécédent</b>, et commencent par un pronom relatif : qui, que, dont, où, lequel, auquel, duquel.</p><div class=\"ex\"><i>L’élève <b>qui</b> travaille réussit.</i> (sujet)<br><i>Le livre <b>que</b> je lis est long.</i> (COD)<br><i>L’ami <b>dont</b> je parle est absent.</i> (de)<br><i>La ville <b>où</b> je vis est grande.</i> (lieu)</div><p><b>Déterminative</b> : sans virgule, indispensable au sens. <b>Explicative</b> : entre virgules, ajoute une précision. <i>Les élèves, qui sont fatigués, partent.</i> (tous)</p>`},
{c:"gram",t:"Complétives, interrogatives indirectes, infinitives et participiales",n:"3AC",h:`<p><b>Complétive</b> : introduite par <i>que</i>, COD du verbe principal. <i>Je pense que tu as raison.</i> Après un verbe de volonté ou de doute : subjonctif. <i>Je veux que tu viennes.</i></p><p><b>Interrogative indirecte</b> : introduite par si, qui, ce que, où, quand… sans point d’interrogation. <i>Je me demande s’il viendra.</i></p><p><b>Infinitive</b> : verbe à l’infinitif avec son propre sujet. <i>Je regarde les enfants jouer.</i></p><p><b>Participiale</b> : participe avec son propre sujet. <i>Le jour se levant, nous sommes partis.</i></p>`},
{c:"gram",t:"La ponctuation",n:"1AC–3AC",h:`<div class=\"tw\"><table><tr><th>Signe</th><th>Emploi</th></tr><tr><td>Point .</td><td>termine une phrase déclarative</td></tr><tr><td>Virgule ,</td><td>énumération, apposition, complément placé en tête de phrase, devant <i>mais</i>. Jamais entre le sujet et le verbe.</td></tr><tr><td>Point-virgule ;</td><td>sépare deux propositions liées par le sens</td></tr><tr><td>Deux-points :</td><td>annonce une énumération, une explication ou une parole rapportée</td></tr><tr><td>Points de suspension…</td><td>phrase inachevée, hésitation, suspense</td></tr><tr><td>? et !</td><td>question, exclamation, ordre, surprise</td></tr><tr><td>Guillemets « »</td><td>citation, parole rapportée, mot mis à distance</td></tr><tr><td>Tiret –</td><td>change de locuteur dans un dialogue</td></tr><tr><td>Parenthèses ( )</td><td>précision secondaire</td></tr></table></div><div class=\"ex\"><i>Il a acheté : du pain, du lait, des œufs ; puis il est rentré.</i></div>`},
{c:"conj",t:"Les temps composés",n:"2AC–3AC",h:`<p>Un temps composé = auxiliaire <b>avoir</b> ou <b>être</b> (au temps simple correspondant) + <b>participe passé</b>. Avec <i>être</i> : aller, venir, partir, arriver, naître, mourir, entrer, sortir, monter, descendre, rester, tomber, devenir, et les verbes pronominaux.</p><div class=\"tw\"><table><tr><th>Temps</th><th>Formation</th><th>Exemple</th></tr><tr><td>Passé composé</td><td>présent + PP</td><td><i>J’ai fini.</i></td></tr><tr><td>Plus-que-parfait</td><td>imparfait + PP</td><td><i>Il avait fini quand je suis arrivé.</i></td></tr><tr><td>Passé antérieur</td><td>passé simple + PP</td><td><i>Quand il eut fini, il partit.</i></td></tr><tr><td>Futur antérieur</td><td>futur + PP</td><td><i>Quand tu auras fini, tu sortiras.</i></td></tr><tr><td>Conditionnel passé</td><td>conditionnel + PP</td><td><i>J’aurais voulu venir.</i></td></tr><tr><td>Subjonctif passé</td><td>subjonctif + PP</td><td><i>Bien qu’il soit parti…</i></td></tr></table></div><p>Le temps composé exprime une action <b>achevée</b> ou <b>antérieure</b> à l’action du temps simple.</p>`},
{c:"orth",t:"Participe passé : les cas particuliers",n:"3AC",h:`<div class=\"tw\"><table><tr><th>Cas</th><th>Règle</th><th>Exemple</th></tr><tr><td>Participe seul</td><td>s’accorde comme un adjectif</td><td><i>Les fenêtres fermées.</i></td></tr><tr><td>Pronom <i>en</i></td><td>invariable</td><td><i>Des pommes, j’en ai mangé.</i></td></tr><tr><td>Verbe impersonnel</td><td>invariable</td><td><i>Les orages qu’il y a eu.</i></td></tr><tr><td><i>fait</i> + infinitif</td><td>invariable</td><td><i>Elle s’est fait couper les cheveux.</i></td></tr><tr><td>coûté, pesé, couru, vécu (mesure)</td><td>invariable</td><td><i>Les années qu’il a vécu.</i> ; mais <i>les dangers qu’il a courus</i></td></tr><tr><td>Pronominal + COI</td><td>invariable</td><td><i>Elles se sont parlé.</i></td></tr><tr><td>Pronominal + COD avant</td><td>accord avec le COD</td><td><i>La main qu’elle s’est coupée</i> (COD après : <i>elle s’est coupé la main</i>)</td></tr></table></div>`},
{c:"style",t:"Dénotation et connotation",n:"2AC–3AC",h:`<p>La <b>dénotation</b> est le sens objectif d’un mot, celui du dictionnaire. La <b>connotation</b> est l’ensemble des sentiments, des images et des valeurs qu’il évoque, selon la culture ou le contexte.</p><div class=\"ex\"><i>Nuit</i> : dénotation = période sans lumière du soleil ; connotations = mystère, peur, repos.<br><i>Colombe</i> : dénotation = oiseau ; connotation = paix.</div>`},
{c:"style",t:"Mélioratif et péjoratif",n:"2AC–3AC",h:`<p>Un terme <b>mélioratif</b> valorise (<i>un chef-d’œuvre, brillant, un génie</i>). Un terme <b>péjoratif</b> dévalorise (<i>un navet, une bagnole, un gosse</i>). Les suffixes péjoratifs : -âtre (<i>verdâtre</i>), -ard (<i>pleurnichard</i>), -asse (<i>paperasse</i>), -aille (<i>ferraille</i>). Mélioratif : -issime (<i>richissime</i>), super-, extra-.</p><div class=\"ex\"><i>voiture</i> (neutre) / <i>bagnole</i> (péjoratif) / <i>bolide</i> (mélioratif)</div>`},
{c:"style",t:"Explicite et implicite",n:"2AC–3AC",h:`<p>L’<b>explicite</b> est ce qui est dit clairement. L’<b>implicite</b> est ce qu’on doit déduire : le <b>présupposé</b> (contenu inclus dans la phrase) et le <b>sous-entendu</b> (ce que le locuteur suggère sans le dire).</p><div class=\"ex\"><i>Tu as encore oublié ton cahier ?</i><br>Explicite : le cahier est oublié. Présupposé : ce n’est pas la première fois.<br><i>Il fait froid ici.</i> Sous-entendu : ferme la fenêtre.</div>`},
{c:"style",t:"L’humour et l’ironie",n:"2AC–3AC",h:`<p><b>L’humour</b> fait sourire en jouant sur un décalage : jeux de mots, exagération, absurde, parodie, comique de situation, de caractère ou de répétition.</p><p><b>L’ironie</b> consiste à dire le contraire de ce qu’on pense (antiphrase) pour critiquer ou se moquer. Indices : exagération, contraste avec la situation, ton, contexte. Quand elle attaque des vices ou des abus, on parle de <b>satire</b>.</p><div class=\"ex\"><i>Sous la pluie : « Quel temps magnifique ! »</i> → ironie.</div>`},
{c:"style",t:"Style direct, indirect et indirect libre",n:"3AC",h:`<div class=\"ex\"><b>Direct</b> : Il dit : « Je suis fatigué. »<br><b>Indirect</b> : Il dit qu’il est fatigué.<br><b>Indirect libre</b> : Il s’assit. Il était fatigué, si fatigué !</div><p>Le <b>style indirect libre</b> n’a ni verbe introducteur ni ponctuation du dialogue : on entend la pensée du personnage dans le récit.</p><p><b>Passage au passé</b> (verbe introducteur au passé) :</p><div class=\"tw\"><table><tr><th>Direct</th><th>Indirect</th></tr><tr><td>présent</td><td>imparfait</td></tr><tr><td>passé composé</td><td>plus-que-parfait</td></tr><tr><td>futur</td><td>conditionnel</td></tr><tr><td>ici / aujourd’hui</td><td>là / ce jour-là</td></tr><tr><td>hier / demain</td><td>la veille / le lendemain</td></tr><tr><td>maintenant</td><td>alors</td></tr><tr><td>est-ce que… ?</td><td>si…</td></tr><tr><td>impératif</td><td>de + infinitif</td></tr></table></div>`}
];
